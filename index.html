<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="计算机保研夏令营 / 预推免截止日期速查表 — 实时倒计时、按学校档次与省份筛选" />
    <link rel="preconnect" href="https://www.shanghairanking.cn" crossorigin />
    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <title>CS 保研 DDL · 倒计时</title>
    <script>
      // Apply theme before paint to avoid FOUC.
      (function () {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem('theme');
        } catch {}

        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        var resolvedTheme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemTheme;
        var root = document.documentElement;

        root.classList.toggle('dark', resolvedTheme === 'dark');
        root.style.colorScheme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]').content =
          resolvedTheme === 'dark' ? '#09090b' : '#fafafa';
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
